version: "1"
name: Cisco Jina Workshop — Dashboard tour
description: >
  Facilitator walkthrough of the five seeded dashboards (keyword vs semantic, CRM,
  lifecycle, Webex CCR, CIRCUIT). Each waitForInput step shows markdown describing
  what the dashboard displays. Open Dashboards in this Kibana, then Continue.
enabled: true
tags:
  - cisco
  - jina
  - workshop
  - dashboards
triggers:
  - type: manual
settings:
  timeout: 4h
steps:
  - name: intro
    type: waitForInput
    with:
      message: |
        ## Cisco Jina workshop — dashboard tour

        Five dashboards on `cisco-jina-corpus` (14 docs), seeded into **this**
        Serverless Search project. Open **Dashboards** in the left nav, then
        mark **Continue** after each talking point.
      schema:
        type: object
        properties:
          continue:
            type: boolean
            title: Continue to Keyword vs semantic
        required: ["continue"]

  - name: keyword_vs_semantic
    type: waitForInput
    with:
      message: |
        ## 1 — Keyword vs semantic

        **Dashboard:** Dashboards → **Cisco Jina — Keyword vs semantic**
        (`cisco-jina-keyword-vs-semantic`)

        **What you are looking at**
        - Left: `MATCH(content, "legal")` — token / OpenSearch-shaped ceiling.
          Umbrella’s e-discovery *legal hold* appears next to Acme counsel language.
        - Right: concept `vendor-lock-in` — semantic neighborhood. Acme stays; Umbrella drops.
        - Bottom: top concepts across the corpus.

        **Talking point:** same business question, two retrieval ceilings.
      schema:
        type: object
        properties:
          continue:
            type: boolean
            title: Continue to CRM Analytics
        required: ["continue"]

  - name: crm_analytics
    type: waitForInput
    with:
      message: |
        ## 2 — CRM Analytics

        **Dashboard:** Dashboards → **Cisco Jina — CRM Analytics** (`cisco-jina-crm`)

        **What you are looking at**
        - Pipeline dollars by Salesforce stage.
        - Competitor mentions for similar-deal narratives.

        **Talking point:** find deals like Acme’s Webex renewal with a reason for every match.
      schema:
        type: object
        properties:
          continue:
            type: boolean
            title: Continue to Lifecycle
        required: ["continue"]

  - name: lifecycle_federated
    type: waitForInput
    with:
      message: |
        ## 3 — Lifecycle federated search

        **Dashboard:** Dashboards → **Cisco Jina — Lifecycle federated search**
        (`cisco-jina-lifecycle`)

        **What you are looking at**
        - Donut: Snowflake · S3 · Elastic as peers.
        - Bars: payload bytes by system.

        **Talking point:** counsel language inside a large payload without a second warehouse.
      schema:
        type: object
        properties:
          continue:
            type: boolean
            title: Continue to Webex CCR
        required: ["continue"]

  - name: webex_ccr
    type: waitForInput
    with:
      message: |
        ## 4 — Webex / CCR East & West

        **Dashboard:** Dashboards → **Cisco Jina — Webex CCR East / West**
        (`cisco-jina-webex-ccr`)

        **What you are looking at**
        - Heatmap: Gov East / West × source.
        - Webex + infra artifact counts by region.

        **Talking point:** CCR replicates; search locally — never cross the Gov boundary at query time.
      schema:
        type: object
        properties:
          continue:
            type: boolean
            title: Continue to CIRCUIT
        required: ["continue"]

  - name: circuit_ecs
    type: waitForInput
    with:
      message: |
        ## 5 — CIRCUIT LLM proxy (ECS)

        **Dashboard:** Dashboards → **Cisco Jina — CIRCUIT LLM proxy (ECS)**
        (`cisco-jina-circuit`)

        **What you are looking at**
        - Concept neighborhood: circuit, llm-proxy, prompt-injection, pii, token-budget, …
        - Events by region.

        **Talking point:** customers choose Elastic LLM, CIRCUIT, or both; Elastic searches the ECS stream either way.
      schema:
        type: object
        properties:
          done:
            type: boolean
            title: Tour complete
        required: ["done"]

  - name: done
    type: console
    with:
      message: "Cisco Jina dashboard tour complete."
